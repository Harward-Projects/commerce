{% extends "auctions/layout.html" %}

{% block body %}

    <h2>Login</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form class="d-grid gap-3" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input autofocus class="form-control" type="text" name="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="password" name="password" placeholder="Password">
        </div>
        <input class="btn btn-primary" type="submit" value="Login" style="width: 200px;">
    </form>
    <br>
    <div class="alert alert-info" style="width: 350px;">
        Don't have an account? <a href="{% url 'register' %}">Register here.</a>
    </div>

{% endblock %}
