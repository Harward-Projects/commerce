{% extends "auctions/layout.html" %}

{% block body %}

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    {% if user.is_authenticated %}

        <!-- <div>{{ listing }}</div> -->

        <h2>Create new listing</h2>

        <p>Provide information for the new listing:</p>

        <form class="d-grid gap-3" action="{% url 'create_listing' %}" method="post">
            {% csrf_token %}
            <div class="form-group">
                <input class="form-control" autofocus type="text" name="title" placeholder="Title">
            </div>
            <div class="form-group">
                <input class="form-control" type="text" name="description" placeholder="Description">
            </div>
            <div class="form-group">
                <input class="form-control" type="number" name="bid_price" placeholder="DecimalNumber for srarting bid", step="0.01">
            </div>
            <div class="form-group">
                <input class="form-control" type="url" name="image_URL" placeholder="Image URL">
            </div>
            <div class="form-group">
                <input class="form-control" type="text" name="category" placeholder="Category">
            </div>
            <div class="form-group">
                <input class="form-control" type="text" name="comment" placeholder="Comment">
            </div>
            <input class="btn btn-primary" type="submit" value="Create" style="width: 200px;">
        </form>
    {% else %}
        <p class=""> You need to log in first to create listing! </p>
    {% endif %}
{% endblock %}
