{% extends "auctions/layout.html" %}

{% block body %}

    <p>Listing: <a href="{% url 'listing' title=item.title %}">{{ item.title|safe }}</a></p>
    <p><img src="{{ item.photo_url|safe }}" alt="{{ item.title|safe }}"></p>
    <p class="">{{ item.description|safe }}</p>
    <p class="">{{ item.price|safe }}</p>

{% endblock %}
