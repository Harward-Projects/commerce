{% extends "auctions/layout.html" %}

{% block body %}
    {% if message %}
        <!-- listing in the below line represents used item in other htmls, 
             this time listing is used to distinguish with below item in for loop -->
        {{ listing.title }} {{ message }}
    {% endif %}
    <h2>Watchlist Listings</h2>

        {% for item in watchlist %}
            <p>Listing: <a href="{% url 'listing' title=item.title %}">{{ item.title|safe }}</a></p>
            <p><img src="{{ item.photo_url|safe }}" alt="{{ item.title|safe }}"></p>
            <p class="">Description: {{ item.description|safe }}</p>
            <p class="">Price: {{ item.price|safe }}</p>
            <hr>
        {% endfor %}
{% endblock %}
